name: sourcing-meta
# Chaque lundi 05:30 UTC (avant le scan de 06:00) : nouvelles marques qui font de la pub Meta → candidates.json
on:
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: tracking-scan
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Sourcing bibliothèque publicitaire Meta
        env:
          META_ADLIB_TOKEN: ${{ secrets.META_ADLIB_TOKEN }}
          SOURCE_MAX_ADD: '30'
        run: node source-meta.js
      - name: Commit
        run: |
          git config user.name "tracking-scanner[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidates.json sourcing/
          git commit -m "sourcing meta $(date -u +%F) [skip ci]" || echo "rien de nouveau"
          git push || echo "rien à pousser"
