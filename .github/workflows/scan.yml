name: tracking-scan
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: tracking-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run tracking scan
        run: node scan.js candidates.json
      - name: Commit results
        run: |
          git config user.name "tracking-scanner[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qualified.json latest-full.json history/
          git commit -m "scan $(date -u +%F) [skip ci]" || echo "no changes"
          git push || echo "nothing to push"
